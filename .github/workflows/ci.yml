name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests and documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax check
        run: |
          for file in app.js mascots.js sw.js tests/regression.js; do
            node --check "$file"
          done

      - name: Regression suite
        run: node tests/regression.js

      - name: Documentation validator
        run: python3 tests/validate-docs.py .
